# Blueprint do Render — https://render.com/docs/blueprint-spec
#
# Por que um servidor Node e não hospedagem estática:
# as APIs do COR e do Antares não enviam cabeçalhos CORS, então o navegador só
# consegue consumi-las via proxy same-origin (server/index.js). Além disso, as
# credenciais precisam ficar no servidor — variáveis VITE_* são embutidas no
# bundle do navegador e ficariam públicas.

services:
  - type: web
    name: trafego-iacor
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '22'
      # Defina os valores no painel do Render (sync: false mantém fora do repo).
      - key: ANTARES_API_KEY
        sync: false
      - key: CORIO_EVENTS_USERNAME
        sync: false
      - key: CORIO_EVENTS_PASSWORD
        sync: false
      - key: WAZE_FEED_URL
        sync: false
      # Tixxi roda em rede interna do COR e NÃO é alcançável pela internet
      # pública. Só funciona se o Render tiver rota até essa rede (VPN/Túnel).
      - key: TIXXI_TARGET
        sync: false
      # --- Histórico de métricas -------------------------------------------
      # Segredo do POST /api/collect (mesmo valor usado pelo agendador).
      - key: COLLECT_SECRET
        sync: false
      # Banco do histórico. Sem ele o servidor usa o driver de arquivo, que NÃO
      # sobrevive a deploys/restarts em hospedagem efêmera — em produção defina
      # um Postgres (Neon/Supabase).
      - key: DATABASE_URL
        sync: false
      - key: TIXXI_API_KEY
        sync: false
      - key: TIXXI_EMAIL
        sync: false
      - key: TIXXI_PASSWORD
        sync: false

# A coleta NÃO roda por setInterval dentro deste serviço: no plano `free` o web
# service hiberna após alguns minutos sem acesso, o que deixaria buracos no
# histórico justamente nos horários sem operador. O agendamento é externo —
# veja .github/workflows/collect-metrics.yml (GitHub Actions, gratuito), que
# chama POST /api/collect a cada 15 minutos com o COLLECT_SECRET.
# Alternativa paga: um serviço do tipo `cron` no Render apontando para o mesmo
# endpoint.
